# One environment for the whole repository, `uv sync` at the root makes every
# module importable without sys.path hacks. The lockfile is committed, so the
# versions are decided here rather than resolved at install time.
#
# A dependency is declared when code in this repository imports it, and not
# before.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madmp-core"
version = "0.1.0"
description = "Declarative maDMP rules with an explicit meta-schema, merged into one typed model."
# The version CI runs and the only one this is ever installed on.
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4",     # rules/*.json validated against rules/rules.schema.json
    "pyyaml",            # project configs (configs/projects/*.yaml)
]

[tool.setuptools.packages.find]
include = ["rules", "configs", "project", "dsw", "registry", "quality_control", "utils"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # The generator writes Jinja and never runs it, so parsing it is a
    # repository check and not something an installed package has to carry.
    "jinja2",
]

# Caches go inside .venv, as disposable as the environment itself.
[tool.pytest.ini_options]
cache_dir = ".venv/.pytest_cache"

[tool.ruff]
target-version = "py312"
cache-dir = ".venv/.ruff_cache"

# No `select`, ruff's own default rule set, which already covers pyflakes,
# pycodestyle errors, import order (I), pyupgrade (UP) and bugbear (B).
