# One environment for the whole repository, `uv sync` at the root makes every
# module importable without sys.path hacks. The lockfile is committed, so the
# versions are decided here rather than resolved at install time.
#
# A dependency is declared when code in this repository imports it, and not
# before.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madmp-core"
version = "0.1.0"
description = "Declarative maDMP rules with an explicit meta-schema, merged into one typed model."
# The version CI runs and the only one this is ever installed on.
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4",     # rules/*.json validated against rules/rules.schema.json
    "pyyaml",            # project configs (configs/projects/*.yaml)
]

[tool.setuptools.packages.find]
include = [
    "rules",
    "configs",
    "project",
    "dsw",
    "registry",
    "quality_control",
    "submission",
    "utils",
]

# The webhook is the one thing here that runs as a service, and the only one
# that needs a web framework. Declared apart so installing the rules and the
# generators does not drag a server in: `pip install madmp-core[submission]`
# is what a DSW deployment installs.
# setuptools ships `.py` and nothing else unless told. Without this the rules
# and the two schemas stay behind, and an installed madmp-core can neither
# validate a rules file nor resolve a pin: the wheel would carry the loader
# and not what it loads.
[tool.setuptools.package-data]
rules = ["*.json", "standards/*/*.json"]
configs = ["*.json"]

[project.optional-dependencies]
submission = [
    "fastapi",
    "uvicorn",
    "python-multipart",  # DSW submits the document as a multipart upload
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # The generator writes Jinja and never runs it, so parsing it is a
    # repository check and not something an installed package has to carry.
    "jinja2",
    # What FastAPI's TestClient drives the webhook through. Starlette refuses
    # to build one without it.
    "httpx2",
]

# Caches go inside .venv, as disposable as the environment itself.
[tool.pytest.ini_options]
cache_dir = ".venv/.pytest_cache"

[tool.ruff]
target-version = "py312"
cache-dir = ".venv/.ruff_cache"

# No `select`, ruff's own default rule set, which already covers pyflakes,
# pycodestyle errors, import order (I), pyupgrade (UP) and bugbear (B).
