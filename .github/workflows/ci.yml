# Jobs are split by what kind of change breaks them, and run in parallel:
#
#   checks   the shape of the Python (lint, format, unit tests)
#   rules    every rules file against the meta-schema, its own coherence
#            rules, and the path it sits at
#   configs  every project config against its schema, and against the id it
#            declares
#   projects every config's pins resolved against the rules they name, and
#            those rules merged, the set being a property no per-file job can
#            see
#   generate every project through both generators, and the artifacts below
#   registry every project's destination in the registry, read: free, or
#            already its own
#   image    the webhook's image builds, from the Dockerfile in this repository
#
# Separate jobs rather than steps of one, so the check list on a pull request
# names the culprit. Each pays its own setup, and they run concurrently, so
# wall-clock is the slowest of the seven.
#
# An eighth reports too but only on a tag, `version`, which refuses a tag that
# does not say what `pyproject.toml` says or that was cut off the default
# branch.
#
# The line is not "before or after validation", it is report or act. The eight
# jobs above only ever report, `generate` and `image` included since neither an
# uploaded artifact nor an unpushed image reaches anything. Three jobs act, and
# they are the only three with `needs:`: `registry-sync` writes into the
# registry repository, `publish` writes into a DSW instance, and `release`
# pushes the webhook's image to the container registry. The first two run on
# the default branch alone and `release` on a version tag alone, so on a pull
# request all three appear as `skipped`, which is what makes their abstention
# readable rather than silent.
#
# `projects` has no `needs:` on purpose, and neither has `registry`. A project
# whose pins do not resolve is broken whether or not something else is, and a
# folder taken by another project is taken whatever else is wrong.
#
# `generate` uploads what it built, on a pull request too, where nothing is
# ever published. That is what the artifact means: what this commit produces,
# not what was published. The publish step ships those exact bytes rather than
# regenerating its own.
#
# Where the registry is comes from repository variables rather than from a
# default in the code, so one deployment's coordinates are never baked into
# another's. `REGISTRY_OWNER` and `REGISTRY_REPO` have to be set for the two
# jobs that touch the registry to run, and `REGISTRY_TOKEN` is a secret.
#
# They all install with `uv sync --frozen`, the committed lockfile decides the
# versions and a transitive release cannot turn CI red on its own.
#
# (!!) `setup-uv` is pinned to a patch, where every other action here floats on
# a major. It stopped publishing moving major tags at v8, so `@v10` resolves to
# nothing at all and every job fails to start. Bumping it is deliberate.
name: CI

# Tags are here for `version` and `release`. Every reporting job runs again on a
# tag, which is the point: what gets published is a commit that passed on the
# day it is published, not on the day it was merged.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default, and every job inherits it. Only `release` needs more,
# and it says so itself, so nothing here can write to this repository by
# holding a token it was handed without asking.
permissions:
  contents: read

# One run at a time per branch, and queued rather than cancelled. Two pushes in
# quick succession would otherwise have two `registry-sync` jobs laying out the
# same folder, the second creating a file the first has just created, GitHub
# answering 422, and the job going red having done nothing wrong. The jobs that
# act are the last ones, so cancelling would kill the run that is about to
# register.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      # The one job that needs the webhook's own dependencies, being the one
      # that runs its tests. Every other job here works on the rules and the
      # generators, which carry no server.
      - name: Install the locked environment
        run: uv sync --frozen --extra submission
      - name: Lint
        run: uv run ruff check .
      # --check reports, never rewrites. CI states the verdict, the editor
      # (ruff on save) and `ruff format` locally do the fixing.
      - name: Format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/ -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every rules file against the meta-schema
        run: uv run python scripts/validate_rules.py

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every project config against its schema
        run: uv run python scripts/validate_configs.py

  projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Resolve and merge what every project pins
        run: |
          set -o pipefail
          uv run python scripts/validate_projects.py 2>&1 | tee projects.txt
      # The field count is the number worth a glance. It moves when a rules
      # file moves, and a change nobody expected there is a change to look at.
      - name: What every project resolves to
        if: always()
        run: |
          {
            echo '### What every project resolves to'
            echo '```'
            cat projects.txt 2>/dev/null || echo '(the check wrote nothing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Build every project's KM and document template
        run: |
          set -o pipefail
          uv run python scripts/validate_generation.py 2>&1 | tee generate.txt
      # The event count and the size of the Jinja are what a generator drifts
      # by. Both are silent in a diff of the sources and loud here.
      - name: What every project generated
        if: always()
        run: |
          {
            echo '### What every project generated'
            echo '```'
            cat generate.txt 2>/dev/null || echo '(the build wrote nothing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Short retention, the artifact is a convenience for whoever is looking
      # at this run and not a store. What is durable is the commit that
      # produces it, and the published package in DSW.
      - uses: actions/upload-artifact@v7
        with:
          name: dsw-artifacts
          path: build/
          retention-days: 14
          if-no-files-found: error

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Without the secret, on a pull request from a fork, it skips loudly,
      # the registry being private so that even reading it needs a token.
      #
      # Both streams into one file, the ok lines going to stdout and the skips
      # and failures to stderr, so what the summary shows is the whole of what
      # the script said. `pipefail`, or the exit code would be `tee`'s and a
      # registry nobody could read would report green.
      - name: Check every project's destination in the registry
        run: |
          set -o pipefail
          uv run python scripts/validate_registry.py 2>&1 | tee registry.txt
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
      # This job answers with a state per project rather than with a yes or a
      # no, and a state is worth reading without opening a log. The summary
      # mirrors the script rather than reformatting it, so there is one place
      # that decides how a destination is phrased.
      #
      # `always()`, because the run worth reading is the one that just failed.
      - name: What it found
        if: always()
        run: |
          {
            echo '### Project destinations in the registry'
            echo '```'
            cat registry.txt 2>/dev/null || echo '(the check wrote nothing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the image, starts it and asks it two questions. It pushes nothing,
  # so a broken image is a red check on the pull request that broke it rather
  # than a failed release weeks later. The layers land in the Actions cache,
  # which is what makes `release` cheap: it builds the same context again and
  # reuses them.
  #
  # No `needs:`. An image that does not build is broken whether or not a rules
  # file is, and saying so early is the whole reason this job is separate.
  #
  # (!!) amd64 alone here, where `release` builds both. The arm64 half is built
  # under QEMU and took 182 of this job's 190 seconds, on every pull request,
  # to prove something a build only ever fails at for a dependency shipping no
  # arm64 wheel. `release` still builds both, so a failure there costs a tag to
  # cut again and can never reach a deployment. The seconds bought back are
  # spent below, on running the thing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        # The action uploads a build record as an artifact of its own, on by
        # default. A run's artifacts should be what it meant to produce, and
        # that record outlived `dsw-artifacts` six times over on the repository
        # default. The build summary it also writes stays, it is markdown on
        # the run page and costs no storage.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          # The context is the repository, not `submission/`: the image
          # installs this package, and the rules it has to carry sit one
          # directory away from the Dockerfile.
          context: .
          file: submission/Dockerfile
          platforms: linux/amd64
          push: false
          # Into the runner's docker daemon, which is what the steps below run.
          load: true
          tags: madmp-submission:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building proves the Dockerfile resolves. It does not prove the wheel
      # carries the files it installs, nor that the entrypoint names a module
      # that exists, and both stay silent until a deployment pulls the image.
      #
      # The four variables are read at startup and refused when empty, so any
      # value does here. Nothing below reaches GitHub: a document is checked
      # before anything is read or written, and this one never passes.
      - name: The image starts, and answers
        run: |
          docker run -d --name webhook -p 8080:8080 \
            -e SUBMISSION_TOKEN=ci -e REGISTRY_TOKEN=ci \
            -e REGISTRY_OWNER=ci -e REGISTRY_REPO=ci \
            madmp-submission:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          # /health answering is the entrypoint, the extra and the environment.
          curl -fsS http://localhost:8080/health
          # And this is the rules files. A document naming versions the wheel
          # does not carry is refused for not loading them, which reads
          # differently from being refused for its own holes, so asserting on
          # the holes is asserting that the rules shipped.
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            -X POST 'http://localhost:8080/submissions?project=glider' \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d '{"dmp":{},"metadata":{"project":"glider","template_version":"1.0.0","rules":[{"rda_dcs":"1.0.0"},{"ostrails":"1.0.0"}]}}')
          echo "$code"; cat body.txt
          test "$code" = "422"
          grep -q 'Quality control failed against rda_dcs 1.0.0, ostrails 1.0.0' body.txt
      - name: What it said, whatever happened above
        if: always()
        run: docker logs webhook || true

  registry-sync:
    # The first of the three jobs that write outside this repository, and like
    # the other two it waits for every verdict, a project is registered from a
    # config that loads, pins that resolve and rules that merge, or it is not
    # registered.
    #
    # Not `needs: image`. A folder is laid out from a config, and a Dockerfile
    # that fails to build says nothing about whether that config is sound.
    needs: [checks, rules, configs, projects, generate, registry]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Runs on every push to the default branch, not only when a config
      # changed. It sends nothing when nothing changed, so a push that touched
      # no config leaves no commit behind.
      - name: Register every project in the registry
        run: |
          set -o pipefail
          uv run python scripts/sync_registry.py 2>&1 | tee sync.txt
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
      # The one job in this repository that writes outside it, so what it sent
      # is the thing worth reading, and `created` or `updated` beside a project
      # is a change to the registry that happened on this push.
      - name: What it sent
        if: always()
        run: |
          {
            echo '### What the registry was told'
            echo '```'
            cat sync.txt 2>/dev/null || echo '(the sync wrote nothing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The second job that acts. After `registry-sync`, because a submission
  # service pointing at an unregistered folder turns every Submit into a
  # failure.
  #
  # It downloads what `generate` built rather than building again, so what
  # gets published is what was produced once.
  #
  # `vars.DSW_API_URL` is the switch. Until an instance is declared this shows
  # as `skipped` in the check list rather than being commented out. It is a
  # variable while the account is two secrets because the `secrets` context is
  # not available in a job-level `if:`, so the switch could not be one.
  publish:
    needs: [registry-sync]
    if: vars.DSW_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: dsw-artifacts
          path: build/
      # Idempotent by version, an already-published package is skipped, so
      # every project is offered every time and only a bumped `version`
      # actually publishes.
      #
      # `all`, so the submission service goes up with the two packages and in
      # that order, a service naming the document template's uuid, which does
      # not exist until the template is published.
      #
      # SUBMISSION_URL names the webhook as the instance reaches it, and this
      # deployment runs the webhook beside DSW on the same compose network, so
      # that address is a service name and not a public one. It is therefore
      # right for an instance running this deployment and wrong for any other,
      # and nothing in the code can tell the two apart.
      - name: Publish every project's KM, document template and submission service
        run: |
          for cfg in configs/projects/*.yaml; do
            uv run python -m dsw.publish all "$cfg"
          done
        env:
          DSW_API_URL: ${{ vars.DSW_API_URL }}
          DSW_EMAIL: ${{ secrets.DSW_EMAIL }}
          DSW_PASSWORD: ${{ secrets.DSW_PASSWORD }}
          SUBMISSION_URL: ${{ vars.SUBMISSION_URL }}
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}

  # What a tag has to be true for. It builds nothing and publishes nothing, it
  # refuses a tag that lies.
  #
  # The version lives in `pyproject.toml` and nowhere else: it is what
  # `importlib.metadata` hands the webhook, which writes it into every verdict
  # it commits, so a tag disagreeing with it would put a version in the
  # registry naming a release nobody can check out. Bumping it is part of
  # cutting the tag, and this is what catches forgetting.
  #
  # (!!) A job of this workflow, and in `release`'s `needs:`. As a workflow of
  # its own it could only ever turn red beside a publish that had already
  # happened: two workflows on one tag push run with no order between them, and
  # GitHub Actions has no `needs:` across workflows.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The ancestry check below reads history this tag is not the tip of,
          # and a shallow clone carries none of it.
          fetch-depth: 0
      - name: The tag and the package version say the same thing
        run: |
          declared=$(python3 -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          ")
          tagged="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared"
          echo "tag:       $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $declared"
            exit 1
          fi
      # A tag can be cut anywhere. One cut off the default branch would publish
      # an image built from code that was never merged, under a version the
      # repository's history does not explain.
      - name: The tag sits on the default branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT"; then
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT, it names code that was never merged"
            exit 1
          fi

  # The third job that acts, and the only one keyed on a tag rather than on the
  # default branch. It publishes the webhook's image, which a DSW deployment
  # pulls and runs: `MADMP_CORE_VERSION` in that deployment's `.env` names one
  # of the tags pushed here, and naming it is the whole of how an operator
  # chooses which engine and which rules judge a submission.
  #
  # A tag alone, never `latest` and never a branch. An image tag that moved
  # would leave two deployments running different code while reporting the same
  # version, and the verdict committed beside every DMP says which version
  # judged it.
  #
  # It builds a second time rather than loading what `image` built. The layers
  # are in the cache by then, so this costs seconds, and passing an image
  # between jobs would be the same bytes with one more step to forget.
  release:
    needs: [checks, rules, configs, projects, generate, registry, image, version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job here that writes to GitHub itself, and it writes packages,
    # not contents.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued for this run and expiring with it, so no long-lived
          # credential has to exist anywhere for a release to happen.
          password: ${{ secrets.GITHUB_TOKEN }}
      # `github.repository` rather than a literal, so renaming this repository
      # moves the package with it instead of publishing under a name that no
      # longer exists.
      - uses: docker/build-push-action@v7
        # As in `image`: the build record is not an artifact of this release.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: submission/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/submission:${{ github.ref_name }}
          cache-from: type=gha
