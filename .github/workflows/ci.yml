# Jobs are split by what kind of change breaks them, and run in parallel:
#
#   checks   the shape of the Python (lint, format, unit tests)
#   rules    every rules file against the meta-schema, its own coherence
#            rules, and the path it sits at
#   configs  every project config against its schema, and against the id it
#            declares
#   projects every config's pins resolved against the rules they name, and
#            those rules merged, the set being a property no per-file job can
#            see
#   generate every project through both generators, and the artifacts below
#   quality- every project's merged rules walked by the quality control
#   control  engine, the set being what decides whether it can walk them
#   registry every project's destination in the registry, read: free, or
#            already its own
#
# Separate jobs rather than steps of one, so the check list on a pull request
# names the culprit. Each pays its own setup, and they run concurrently, so
# wall-clock is the slowest of the seven.
#
# The line is not "before or after validation", it is report or act. The seven
# jobs above only ever report, `generate` included since an uploaded artifact
# is scoped to its own run and reaches nothing. Two jobs act, and they are the
# only two with `needs:`, `registry-sync` writes into the registry repository
# and `publish` writes into a DSW instance. Both run on the default branch
# alone, and on a pull request both appear as `skipped`, which is what makes
# their abstention readable rather than silent.
#
# `projects` has no `needs:` on purpose, and neither has `quality-control` or
# `registry`. A project whose pins do not resolve is broken whether or not
# something else is, and a folder taken by another project is taken whatever
# else is wrong.
#
# `generate` uploads what it built, on a pull request too, where nothing is
# ever published. That is what the artifact means: what this commit produces,
# not what was published. The publish step ships those exact bytes rather than
# regenerating its own.
#
# Where the registry is comes from repository variables rather than from a
# default in the code, so one deployment's coordinates are never baked into
# another's. `REGISTRY_OWNER` and `REGISTRY_REPO` have to be set for the two
# jobs that touch the registry to run, and `REGISTRY_TOKEN` is a secret.
#
# They all install with `uv sync --frozen`, the committed lockfile decides the
# versions and a transitive release cannot turn CI red on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per branch, and queued rather than cancelled. Two pushes in
# quick succession would otherwise have two `registry-sync` jobs laying out the
# same folder, the second creating a file the first has just created, GitHub
# answering 422, and the job going red having done nothing wrong. The jobs that
# act are the last ones, so cancelling would kill the run that is about to
# register.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      # --check reports, never rewrites. CI states the verdict, the editor
      # (ruff on save) and `ruff format` locally do the fixing.
      - name: Format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/ -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every rules file against the meta-schema
        run: uv run python scripts/validate_rules.py

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every project config against its schema
        run: uv run python scripts/validate_configs.py

  projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Resolve and merge what every project pins
        run: uv run python scripts/validate_projects.py

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Build every project's KM and document template
        run: uv run python scripts/validate_generation.py
      # Short retention, the artifact is a convenience for whoever is looking
      # at this run and not a store. What is durable is the commit that
      # produces it, and the published package in DSW.
      - uses: actions/upload-artifact@v4
        with:
          name: dsw-artifacts
          path: build/
          retention-days: 14
          if-no-files-found: error

  quality-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Walk every project's merged rules with the quality control engine
        run: uv run python scripts/validate_quality_control.py

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Without the secret, on a pull request from a fork, it skips loudly,
      # the registry being private so that even reading it needs a token.
      - name: Check every project's destination in the registry
        run: uv run python scripts/validate_registry.py
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}

  registry-sync:
    # The only job that writes outside this repository, so the only one that
    # waits for every verdict, a project is registered from a config that
    # loads, pins that resolve, rules that merge and a model the quality
    # control can walk, or it is not registered.
    needs: [checks, rules, configs, projects, generate, quality-control, registry]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Runs on every push to the default branch, not only when a config
      # changed. It sends nothing when nothing changed, so a push that touched
      # no config leaves no commit behind.
      - name: Register every project in the registry
        run: uv run python scripts/sync_registry.py
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}

  # The second job that acts. After `registry-sync`, because a submission
  # service pointing at an unregistered folder turns every Submit into a
  # failure.
  #
  # It downloads what `generate` built rather than building again, so what
  # gets published is what was produced once.
  #
  # `vars.DSW_API_URL` is the switch. Until an instance is declared this shows
  # as `skipped` in the check list rather than being commented out. It is a
  # variable while the account is two secrets because the `secrets` context is
  # not available in a job-level `if:`, so the switch could not be one.
  publish:
    needs: [registry-sync]
    if: vars.DSW_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: dsw-artifacts
          path: build/
      # Idempotent by version, an already-published package is skipped, so
      # every project is offered every time and only a bumped `version`
      # actually publishes.
      #
      # `all`, so the submission service goes up with the two packages and in
      # that order, a service naming the document template's uuid, which does
      # not exist until the template is published.
      #
      # SUBMISSION_URL names the webhook as the instance reaches it, and this
      # deployment runs the webhook beside DSW on the same compose network, so
      # that address is a service name and not a public one. It is therefore
      # right for an instance running this deployment and wrong for any other,
      # and nothing in the code can tell the two apart.
      - name: Publish every project's KM, document template and submission service
        run: |
          for cfg in configs/projects/*.yaml; do
            uv run python -m dsw.publish all "$cfg"
          done
        env:
          DSW_API_URL: ${{ vars.DSW_API_URL }}
          DSW_EMAIL: ${{ secrets.DSW_EMAIL }}
          DSW_PASSWORD: ${{ secrets.DSW_PASSWORD }}
          SUBMISSION_URL: ${{ vars.SUBMISSION_URL }}
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: ${{ vars.REGISTRY_OWNER }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
