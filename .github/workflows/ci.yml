# Jobs are split by what kind of change breaks them, and run in parallel:
#
#   checks  — the shape of the Python (lint, format, unit tests)
#   rules   — the shape of the rules content (every rules file against the
#             meta-schema, its own coherence rules, and the path it sits at)
#   configs — the shape of the project content (every project config against
#             its schema, and against the id it declares)
#   projects — the one job that crosses them: every config's pins resolved
#             against the rules they name, and those rules merged. The set is
#             a property no per-file job can see.
#   generate — every project through both generators. The tests generate one
#             project deeply; this is the only place the others are generated
#             at all. It is also what produces the artifacts, below.
#   registry — every project's destination in the registry, read: free, or
#             already its own.
#
# They are separate jobs rather than steps of one so that the check list on a
# pull request names the culprit: a Python change, a rules change and a new
# project are made by different people and fixed in different files. Each pays
# its own setup, but they run concurrently, so wall-clock is the slowest of
# the six.
#
# `projects` has no `needs:` on purpose. It could only be held back to spare a
# second red check when a file is also malformed, and that trade is the wrong
# way round: a project whose pins do not resolve is broken whether or not
# something else is, and finding out on the next push costs more than one
# extra red mark. The same goes for `registry`: a folder taken by another
# project is taken whatever else is wrong.
#
# `generate` uploads what it built. One definition of "what this commit
# produces", kept in one place: a reviewer downloads it to see what a rules
# change did to the questionnaire, and the publish step will ship those exact
# bytes rather than regenerate its own. It uploads on a pull request too,
# where nothing is ever published — which is what the artifact means: what
# this commit produces, not what was published. Committing it instead would
# add a third answer, and the only one that can silently go stale.
#
# Where the registry is, is written here rather than defaulted in the code:
# this workflow *is* this deployment, so its coordinates belong in it, in the
# open, where a diff shows them. `REGISTRY_TOKEN` is the one thing that cannot
# be, and it is a repository secret.
#
# The line is not "before or after validation", it is **report or act**. The
# six jobs above only ever report, so they run concurrently and each names its
# own culprit — `generate` included: an uploaded artifact is scoped to its own
# run and reaches nothing. Two jobs act, and they are the only two with
# `needs:`: `registry-sync` writes into the registry repository, `publish`
# writes into a DSW instance. Both run on the default branch alone, and on a
# pull request both appear as `skipped` — which is what makes their abstention
# readable rather than silent.
#
# They all install with `uv sync --frozen`: the committed lockfile decides the
# versions, and a transitive release cannot turn CI red on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      # --check reports, never rewrites: CI states the verdict, the editor
      # (ruff on save) and `ruff format` locally do the fixing.
      - name: Format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/ -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every rules file against the meta-schema
        run: uv run python scripts/validate_rules.py

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Validate every project config against its schema
        run: uv run python scripts/validate_configs.py

  projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Resolve and merge what every project pins
        run: uv run python scripts/validate_projects.py

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Build every project's KM and document template
        run: uv run python scripts/validate_generation.py
      # Short retention: the artifact is a convenience for whoever is looking
      # at this run, not a store. What is durable is the commit that produces
      # it, and the published package in DSW.
      - uses: actions/upload-artifact@v4
        with:
          name: dsw-artifacts
          path: build/
          retention-days: 14
          if-no-files-found: error

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Reads the registry and reports; the one fault it can find is a folder
      # that carries another project's id. A folder that does not exist yet is
      # not a fault — `registry-sync` below is what creates it. Without the
      # secret (a pull request from a fork) it skips, loudly: the registry is
      # private, so even reading it needs a token.
      - name: Check every project's destination in the registry
        run: uv run python scripts/validate_registry.py
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: Pierrott64
          REGISTRY_REPO: dmp-registry

  registry-sync:
    # The only job that writes outside this repository, so the only one that
    # waits for every verdict — a project is registered from a config that
    # loads, pins that resolve and rules that merge, or it is not registered.
    needs: [checks, rules, configs, projects, generate, registry]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      # Runs on every push to the default branch, not only when a config
      # changed: meta.yaml freezes the rules versions a project was built
      # from, and converging every time is what makes drift impossible rather
      # than unlikely. It sends nothing when nothing changed, so this leaves
      # no commit behind on a push that touched no config.
      - name: Register every project in the registry
        run: uv run python scripts/sync_registry.py
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: Pierrott64
          REGISTRY_REPO: dmp-registry

  # The second job that acts, and the only one a researcher sees the effect
  # of. After `registry-sync`, because a submission service pointing at an
  # unregistered folder turns every Submit into a failure — `dsw.publish`
  # refuses that on its own, and this ordering means it never has to.
  #
  # It downloads what `generate` built rather than building again: what gets
  # published is what was produced once, not a second build nobody looked at.
  #
  # `vars.DSW_API_URL` is the switch. There is no reachable instance yet — a
  # GitHub runner cannot dial localhost:3000 — so until one is declared, this
  # shows as `skipped` in the check list, which is the whole point of gating
  # on a variable rather than commenting the job out. A Codespaces URL is also
  # why it is a repository variable and not written here like the registry's
  # coordinates: it changes at every creation, and a variable is edited
  # without a commit. What never changes is that the code assumes nothing —
  # `dsw.publish` reads all five names with no default.
  publish:
    needs: [registry-sync]
    if: vars.DSW_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: dsw-artifacts
          path: build/
      # Idempotent by version: an already-published package is skipped, so
      # every project is offered every time and only a bumped `version`
      # actually publishes. The submission service is an upsert by id.
      - name: Publish every project's KM, template and submission service
        run: |
          for cfg in configs/projects/*.yaml; do
            uv run python -m dsw.publish all "$cfg"
          done
        env:
          DSW_API_URL: ${{ vars.DSW_API_URL }}
          DSW_EMAIL: ${{ vars.DSW_EMAIL }}
          DSW_PASSWORD: ${{ secrets.DSW_PASSWORD }}
          SUBMISSION_URL: ${{ vars.SUBMISSION_URL }}
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_OWNER: Pierrott64
          REGISTRY_REPO: dmp-registry
