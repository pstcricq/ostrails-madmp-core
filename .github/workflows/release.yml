# What a tag has to be true for. Nothing here builds or publishes, a release is
# a tag and this only refuses one that lies.
#
# The version lives in `pyproject.toml` and nowhere else: it is what
# `importlib.metadata` hands the webhook, which writes it into every verdict it
# commits, so a tag that disagrees with it would put a version in the registry
# naming a release nobody can check out. Bumping it is part of cutting the tag,
# and this is what catches forgetting.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and the package version say the same thing
        run: |
          declared=$(python3 -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          ")
          tagged="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared"
          echo "tag:       $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $declared"
            exit 1
          fi
