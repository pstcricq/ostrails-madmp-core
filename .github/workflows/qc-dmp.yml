# Quality control of one submitted DMP, run from the repository that holds it.
#
# The document and the rules versions it was built from live in the registry,
# the engine and the rules files live here, so the check runs where the
# document is and reaches for this repository.
#
# Caller side, the whole file:
#
#   name: QC
#   on: [push, pull_request]
#   jobs:
#     qc:
#       uses: pstcricq/ostrails-madmp-core/.github/workflows/qc-dmp.yml@v0.1.0
#       with:
#         dmp_path:  projects/glider/template/dmp_glider_template.json
#         pins_path: projects/glider/template/dmp_glider_template.meta.json
#       secrets:
#         madmp_core_token: ${{ secrets.MADMP_CORE_TOKEN }}
#
# The engine comes from the commit this file was called at, not from the
# default branch. A DMP that passed must go on passing, and pulling the latest
# engine under a document nobody touched would turn old submissions red for a
# change made here.
name: QC DMP

on:
  workflow_call:
    inputs:
      dmp_path:
        description: "Path of the DMP JSON to check, inside the calling repo"
        required: true
        type: string
      pins_path:
        description: >-
          Path of the file naming the rules versions to check against, inside
          the calling repo. In the registry that is the provenance file the
          submission webhook commits beside the DMP, so the check runs the
          exact versions the document was built with. Any file carrying the
          same 'rules: [{standard: version}, ...]' key works.
        required: true
        type: string
      madmp_core_ref:
        description: >-
          Override which commit, tag or branch of madmp-core to run. Leave it
          unset, the default is the release this workflow file belongs to,
          which is the tag a caller fetched it at.
        required: false
        type: string
        default: ""
    secrets:
      madmp_core_token:
        description: >-
          Token that can read madmp-core (fine-grained PAT, Contents: Read).
          Required while madmp-core is private: a called workflow runs with
          the CALLER's GITHUB_TOKEN, which has no access to another private
          repository. Leave it unset if madmp-core ever becomes public.
        required: false

permissions:
  contents: read

jobs:
  quality-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A called workflow cannot read its own ref: `github.workflow_ref` and
      # `github.workflow_sha` both name the CALLER's workflow, and there is no
      # context field for this one. RELEASE is the answer, and it is a sound
      # one: this file is fetched at the tag a caller pins, so the tag written
      # here is the tag that fetched it, and cutting a release means bumping
      # it in the same commit. Forgetting runs an older engine, never a newer
      # one, which is the harmless direction, a DMP that passed goes on
      # passing.
      - name: Resolve which madmp-core to run
        id: core
        env:
          RELEASE: v0.1.2
          REF: ${{ inputs.madmp_core_ref }}
        run: |
          ref="${REF:-$RELEASE}"
          echo "running madmp-core at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The calling repository, which holds the document and its pins.
      - uses: actions/checkout@v4

      # This repository, which holds the rules files and the engine.
      - uses: actions/checkout@v4
        with:
          repository: pstcricq/ostrails-madmp-core
          ref: ${{ steps.core.outputs.ref }}
          # Falls back to the caller's own token, which is enough only if
          # madmp-core is public. While it is private the caller must pass
          # madmp_core_token, or this step fails with "repository not found".
          token: ${{ secrets.madmp_core_token || github.token }}
          path: .madmp-core

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install madmp-core's locked environment
        run: uv sync --frozen --project .madmp-core

      # Run from the calling repository's root, so both paths are the caller's
      # own. `--rules-dir` is not passed: the package is installed from
      # .madmp-core, so its default already resolves to the rules files that
      # were checked out beside it.
      - name: Quality control
        run: |
          uv run --frozen --project .madmp-core python -m quality_control.run \
            --pins "${{ inputs.pins_path }}" \
            --dmp "${{ inputs.dmp_path }}" \
            --json qc_results.json

      # Uploaded pass or fail alike, a failing DMP being exactly when the
      # report matters most. The step above decides the verdict, this one only
      # keeps it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-report
          path: qc_results.json
          retention-days: 14
          if-no-files-found: warn
